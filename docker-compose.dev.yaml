services:
  apriltag_pose:
    image: apriltag_dev:latest
    build:
      context: .
      dockerfile: .ci/Dockerfile
      target: dev
    container_name: apriltag_dev
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/host_ws
      - /dev:/dev
    stdin_open: true
    tty: true
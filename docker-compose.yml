# apriltag_pose - AprilTag Detection (ROS Humble + OpenGL)
# Standalone: docker compose up
# Combined:  included from ~/docker-compose.yml

services:
  apriltag_pose:
    image: inria_docker:orbbec
    container_name: apriltag_pose
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=1
      - RMW_IMPLEMENTATION=
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
      - ./apriltag_pose:/ros2_ws/src/apriltag_pose:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
